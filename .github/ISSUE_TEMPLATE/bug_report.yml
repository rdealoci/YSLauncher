name: Bug Report
description: Report an error, crash, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can reproduce and fix it.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you running?
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian/Arch/Fedora)
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher Version
      description: What version of YSLauncher are you using?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this behavior?
      placeholder: |
        1. Open the launcher
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any terminal output, error logs, or drag and drop screenshots here.
